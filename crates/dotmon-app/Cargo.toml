[package]
name = "dotmon"
description = "Dotmon — moniteur système et gestionnaire de tâches natif pour Linux/Wayland."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dotmon"
path = "src/main.rs"

[dependencies]
dotmon-core = { workspace = true }
dotmon-sys = { workspace = true }
dirs = { workspace = true }
# Wayland-native winit backend + OpenGL (femtovg) renderer, with the software
# renderer as automatic fallback. No X11, no Qt.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "accessibility",
    "backend-winit-wayland",
    "renderer-femtovg",
    "renderer-software",
] }

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
# Path rendering for the headless software-renderer test (charts).
slint = { version = "1.18.1", default-features = false, features = ["software-renderer-path"] }
